services:
  app:
    build: .
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: database
      DB_NAME: ql_thietbi
      DB_USER: root
      DB_PASS: rootpassword
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: project-files
    depends_on:
      - database
      - minio
    networks:
      - qa_cloud
  database:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ql_thietbi
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - qa_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - qa_cloud
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "127.0.0.1:18081:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    depends_on:
      - database
    networks:
      - qa_cloud
  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - qa_minio_data:/data
    networks:
      - qa_cloud
volumes:
  qa_db_data:
  qa_minio_data:
networks:
  qa_cloud:
